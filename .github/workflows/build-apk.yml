name: Compilar APK de Ondas Player

on:
  push:
    paths: ['mi-spotify/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-spotify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mi-spotify/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias y construir la web
        run: |
          npm ci
          npm run build

      - name: Copiar la web al proyecto Android
        run: npx cap sync android

      - name: Compilar APK (debug, firmado con clave de desarrollo)
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ondas-player.apk

      - name: Subir APK como artefacto del workflow
        uses: actions/upload-artifact@v4
        with:
          name: ondas-player-apk
          path: mi-spotify/ondas-player.apk
          retention-days: 30

      # Además se publica como "Release" para tener un enlace de descarga directo.
      - name: Publicar en Releases (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Ondas Player APK (última compilación)
          body: |
            APK compilado automáticamente desde la rama `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Descarga `ondas-player.apk`, ábrelo en el teléfono y permite instalar apps de este origen.
          prerelease: true
          files: mi-spotify/ondas-player.apk
